<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="200" cy="200" r="200"/>
    </clipPath>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Body / shoulders -->
  <ellipse cx="200" cy="340" rx="130" ry="90" fill="rgba(255,255,255,0.18)"/>
  <!-- Head -->
  <circle cx="200" cy="155" r="72" fill="rgba(255,255,255,0.25)"/>
  <!-- Inner face highlight -->
  <circle cx="200" cy="148" r="52" fill="rgba(255,255,255,0.15)"/>
  <!-- RB monogram -->
  <text x="200" y="172" text-anchor="middle" font-family="system-ui,sans-serif" font-size="48" font-weight="800" fill="rgba(255,255,255,0.9)">MR</text>
</svg>
